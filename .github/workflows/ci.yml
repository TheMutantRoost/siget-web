name: CI
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: siget_test
          MYSQL_USER: siget
          MYSQL_PASSWORD: siget_dev_pw
        ports: ["3306:3306"]
        options: --health-cmd="mysqladmin ping -proot" --health-interval=5s --health-retries=20
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.14" }
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
        env: { DATABASE_URL: "mysql+pymysql://siget:siget_dev_pw@127.0.0.1:3306/siget_test" }
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "26" }
      - run: npm ci
      - run: npm run build
  imagen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t siget-web .
      - name: Arranque con MySQL
        run: |
          docker network create red
          docker run -d --name db --network red -e MYSQL_ROOT_PASSWORD=root -e MYSQL_DATABASE=siget mysql:8.4
          for i in $(seq 1 40); do docker exec db mysqladmin ping -proot --silent && break; sleep 3; done
          sleep 10
          docker run -d --name app --network red -p 8000:8000 -e DATABASE_URL=mysql://root:root@db:3306/siget \
            -e ENTORNO=demo -e ADMIN_PASSWORD=Prueba2026ci -e CARGAR_DATOS_DEMO=1 siget-web
          for i in $(seq 1 30); do curl -fs localhost:8000/api/salud && break; sleep 3; done
          curl -fs localhost:8000/ | grep -q "SIGET WEB"
          docker logs app | tail -20
